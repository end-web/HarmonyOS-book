<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ef;color:#28282e;font:15px/1.6 "HarmonyOS Sans SC","Microsoft YaHei",sans-serif;--paper:#fffefa;--muted:#777780;--line:#e5e1db;--accent:#963f59;transition:background .2s,color .2s}
body.dark{background:#191a20;color:#eeeef3;--paper:#25262e;--muted:#aaaab8;--line:#3c3d48;--accent:#e99eb3}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid var(--accent);outline-offset:4px}main{max-width:1200px;margin:auto;padding:48px 32px 28px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.eyebrow{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:3px}h1{font-size:clamp(26px,4vw,40px);letter-spacing:-1px;margin:8px 0 10px;line-height:1.3}p{margin:0;color:var(--muted)}.controls{display:flex;gap:8px;flex-wrap:wrap}.control{border:1px solid var(--line);background:var(--paper);padding:9px 15px;border-radius:24px;font-size:13px}.control[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}.intro{margin-bottom:32px;max-width:660px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{position:relative;border:1px solid var(--line);background:var(--paper);padding:26px 20px 20px;border-radius:22px;text-align:left;transition:transform .18s,border-color .18s,box-shadow .18s}.card:hover{transform:translateY(-3px)}.card[aria-pressed=true]{border:2px solid var(--accent);padding:25px 19px 19px;box-shadow:0 8px 28px #5327350c}.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.number{font-size:12px;letter-spacing:2px;color:var(--muted)}.badge{font-size:11px;color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,transparent);border-radius:20px;padding:3px 10px}.icon{display:block;width:100%;height:100%;border-radius:23%;box-shadow:0 12px 24px #1c22351c}.circle .icon{border-radius:50%}.icon-frame{width:148px;height:148px;margin:0 auto 23px}.card h2{font-size:18px;margin:0 0 4px}.card p{font-size:12px;min-height:20px}.swatches{display:flex;gap:7px;align-items:center;margin-top:15px;font-size:11px;color:var(--muted);font-family:Consolas,monospace}.dot{height:13px;width:13px;border-radius:50%;border:1px solid #8883;display:inline-block}.divider{height:1px;background:var(--line);margin:38px 0 28px}.detail{display:grid;grid-template-columns:1fr 1.2fr;gap:28px;align-items:stretch}.detail-info{padding:10px 0}.detail-info h2{font-size:26px;margin:6px 0 10px}.detail-info p{max-width:440px}.tokens{display:flex;gap:16px;flex-wrap:wrap;margin-top:22px}.token{font-size:11px;color:var(--muted)}.token strong{font:13px Consolas,monospace;color:inherit;display:block;margin-top:3px}.token .dot{margin-right:6px;vertical-align:middle}.stage{background:linear-gradient(140deg,#eeebe6,#ddd8d0);padding:28px;border:1px solid var(--line);border-radius:24px;display:flex;gap:30px;align-items:center;justify-content:center;min-height:230px}.dark .stage{background:linear-gradient(140deg,#363944,#20212a)}.app{text-align:center;color:#464550;font-size:12px}.dark .app{color:#e5e6ee}.app span{display:block;margin-top:10px}.big{width:128px;height:128px}.small{width:64px;height:64px}.tiny{width:40px;height:40px}.size{font:10px Consolas,monospace!important;color:var(--muted);margin-top:6px!important}.foot{font-size:12px;color:var(--muted);margin-top:28px;display:flex;justify-content:space-between;gap:16px}.status{font-size:12px;color:var(--accent);margin-top:15px;min-height:20px}.note{font-size:11px;margin-top:15px} @media(max-width:750px){main{padding:28px 18px}.top{align-items:flex-start;flex-direction:column;gap:15px}.intro{margin-top:16px}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.card{padding:18px 14px}.card[aria-pressed=true]{padding:17px 13px}.icon-frame{width:112px;height:112px}.detail{grid-template-columns:1fr}.stage{gap:24px}.foot{flex-direction:column}.swatches{font-size:10px;gap:4px}} @media(prefers-reduced-motion:reduce){*{transition:none!important}}

<main>
  <header class="top">
    <div><div class="eyebrow">简听阅读 / ICON COLOR STUDY</div><h1>同一个声波，六种气质。</h1></div>

  </section>

const source = new Image(), original = new Image(), background = new Image();
const icons = [];
function drawIcon(p) {
 const canvas = document.createElement('canvas'); canvas.width = canvas.height = 1024;
 const ctx = canvas.getContext('2d');
 if(p.original) { ctx.drawImage(original,0,0,1024,1024); return canvas.toDataURL('image/png'); }
 // 从原图背景逐像素映射配色，保留局部光晕的位置、形态和明暗层次。
 ctx.drawImage(background,0,0,1024,1024);
 const pixels=ctx.getImageData(0,0,1024,1024), data=pixels.data;
 const rgb=hex=>[1,3,5].map(offset=>parseInt(hex.slice(offset,offset+2),16));
 const light=rgb(p.start), dark=rgb(p.end);
 for(let i=0;i<data.length;i+=4){
  const luminance=(0.2126*data[i]+0.7152*data[i+1]+0.0722*data[i+2])/255;
  const t=Math.max(0,Math.min(1,(luminance-0.32)/0.37));
  for(let c=0;c<3;c++)data[i+c]=Math.round(dark[c]+(light[c]-dark[c])*t);
 }
 ctx.putImageData(pixels,0,0);
 const layer=document.createElement('canvas');layer.width=layer.height=1024;const lc=layer.getContext('2d');
 lc.drawImage(source,0,0,1024,1024);lc.globalCompositeOperation='source-in';lc.fillStyle=p.ink;lc.fillRect(0,0,1024,1024);ctx.drawImage(layer,0,0);
 return canvas.toDataURL('image/png');
}
function iconImage(index, size) {const img=document.createElement('img');img.src=icons[index];img.className='icon';img.alt=palettes[index].name+'声波图标';if(size){img.width=size;img.height=size;}return img;}
function select(index) {
 selected=index;const p=palettes[index];document.querySelectorAll('.card').forEach((c,i)=>c.setAttribute('aria-pressed',String(i===index)));
 document.getElementById('name').textContent=p.name;document.getElementById('description').textContent=p.description;
 const tokens=document.getElementById('tokens');tokens.replaceChildren();
 if(!p.original) [['背景起色',p.start],['背景深色',p.end],['主体',p.ink]].forEach(([label,color])=>{const node=document.createElement('div');node.className='token';node.innerHTML='<span class="dot" style="background:'+color+'"></span>'+label+'<strong>'+color+'</strong>';tokens.append(node);});
 document.getElementById('detailNote').textContent=p.original?'绿色参照直接使用原图，不做重新着色。':'保留原主体轮廓，并沿用绿色原图背景的局部光晕与明暗纹理。';
 const stage=document.getElementById('stage');stage.replaceChildren();
 [['big',128],['small',64],['tiny',40]].forEach(([className,size])=>{const app=document.createElement('div');app.className='app';const frame=document.createElement('div');frame.className=className;frame.append(iconImage(index,size));app.append(frame);const label=document.createElement('span');label.textContent='简听阅读';app.append(label);const dimension=document.createElement('span');dimension.className='size';dimension.textContent=size+' px';app.append(dimension);stage.append(app);});
 document.getElementById('status').textContent='当前选择：'+String(index+1).padStart(2,'0')+' · '+p.name;

function loadImage(img,data){return new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=data;});}
Promise.all([loadImage(source,foregroundData),loadImage(original,originalData),loadImage(background,backgroundData)]).then(()=>{
 palettes.forEach((p,i)=>{icons.push(drawIcon(p));const card=document.createElement('button');card.className='card';card.type='button';card.setAttribute('aria-pressed','false');card.setAttribute('aria-label','选择'+p.name);card.innerHTML='<div class="card-top"><span class="number">'+String(i+1).padStart(2,'0')+'</span><span class="badge">'+p.tag+'</span></div>';const frame=document.createElement('div');frame.className='icon-frame';frame.append(iconImage(i));card.append(frame);const name=document.createElement('h2');name.textContent=p.name;card.append(name);const hint=document.createElement('p');hint.textContent=p.hint;card.append(hint);if(!p.original){const colors=document.createElement('div');colors.className='swatches';colors.innerHTML='<i class="dot" style="background:'+p.start+'"></i><i class="dot" style="background:'+p.end+'"></i>'+p.start+' → '+p.end;card.append(colors);}else{const caption=document.createElement('div');caption.className='swatches';caption.textContent='项目原图 · 同比例对比';card.append(caption);}card.addEventListener('click',()=>select(i));document.getElementById('grid').append(card);});select(0);
}).catch(()=>{document.getElementById('status').textContent='图标未能载入，请重新打开页面。';});
document.getElementById('theme').addEventListener('click',function(){const active=document.body.classList.toggle('dark');this.setAttribute('aria-pressed',String(active));this.textContent=active?'浅色桌面':'深色桌面';});
document.getElementById('shape').addEventListener('click',function(){const active=document.body.classList.toggle('circle');this.setAttribute('aria-pressed',String(active));this.textContent=active?'圆角裁切':'圆形裁切';});
