<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 简听 · 分层图标前景层：透明底，仅留「摊开的书 + 横贯书身的声波」 -->
  <defs>
    <!-- userSpaceOnUse：两页共用同一渐变，中缝不会出现接缝 -->
    <linearGradient id="ink" gradientUnits="userSpaceOnUse"
                    x1="300" y1="420" x2="740" y2="822">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E2FAF0"/>
    </linearGradient>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="15" stdDeviation="17" flood-color="#00553A" flood-opacity="0.30"/>
    </filter>
    <!-- 书身挖空声波：白色=保留，黑色=镂空 -->
    <mask id="wave">
      <g fill="#FFFFFF" filter="url(#lift)">
        <path d="M262,440 Q262,420 282,420 C350,422 440,430 498,448 L498,820
                 C430,816 340,790 282,748 Q262,748 262,728 Q250,584 262,440 Z"/>
        <path d="M762,440 Q762,420 742,420 C674,422 584,430 526,448 L526,820
                 C594,816 684,790 742,748 Q762,748 762,728 Q774,584 762,440 Z"/>
      </g>
      <path d="M320,634 C352,590 384,590 416,634 C448,678 480,678 512,634
               C544,590 576,590 608,634 C640,678 672,678 704,634"
            fill="none" stroke="#000000" stroke-width="40" stroke-linecap="round"/>
    </mask>
  </defs>
  <!-- 设计坐标 524×402，放大到画布 71% × 55% 并做光学居中 -->
  <g transform="translate(512,512) scale(1.39) translate(-512,-621)">
    <rect x="-420" y="-420" width="1880" height="1880" fill="url(#ink)" mask="url(#wave)"/>
  </g>
</svg>
