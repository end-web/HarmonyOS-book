<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>简听｜让听书与阅读更从容</title><style>*{box-sizing:border-box}body{margin:0;background:#F6F3ED;font-family:"Microsoft YaHei","PingFang SC",sans-serif}article{max-width:700px;margin:30px auto;padding:32px;background:#fff}@media(max-width:600px){body{background:#fff}article{margin:0;padding:24px 20px}}</style></head><body><article><h1 style="font-size:25px;line-height:1.5;color:#28292B;margin:0 0 25px;">简听｜让听书与阅读更从容</h1><p style="font-size:16px;line-height:1.95;color:#383633;letter-spacing:.5px;margin:20px 0;">简听是一款鸿蒙原生听书与小说阅读 App，有声书、电子书、本地音频，一个书架轻松管理。</p><p style="font-size:16px;line-height:1.95;color:#383633;letter-spacing:.5px;margin:20px 0;">导入书源即可多源搜索，支持进度续播、倍速调节、跳过片头片尾和睡眠定时；音频 ZIP 可直接导入，章节可下载、导出。</p><p style="font-size:16px;line-height:1.95;color:#383633;letter-spacing:.5px;margin:20px 0;">阅读支持字号、行高、多种主题与自定义背景，自动记住阅读位置。搭配后台播放、系统媒体控制与收听统计，让听书和阅读更从容。</p><img alt="简听产品配图" style="width:100%;height:auto;display:block;margin-top:28px;" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABwgAAAL+CAIAAAA2AtdyAAEAAElEQVR42uy9d5wkZbX/f87zVOg0eWZnNu/CLrtLzogkQYIkMaCIiSRXUcFrTqj3e8Vr+JkxXCMoCmJGQBQvKEFyWNICCxvZMLOTZzpW1fOc3x81O/ROjsvs7ud9fe2dqa6u7qmu6qbe/TnncL63nQAAAAAAAAAAEBXaOrATAAAAgN2JZH3tcDcp7B0AAAAAAAAAIFhRAAAAYA/7fIcYBQAAAAAAAABYUQAAAGCP+5SHGAUAAAAAAADgeglWFAAAANjjPushRgEAAAAAAAC4UgIAAADAHveJDzEKAAAAAAAAwDUSAAAAAPa4z32IUQAAAAAAAACujgAAAACwx336Q4wCAAAAAAAAYEUBAAAAsMf9NwDne9uxOwAAAAAAAABQogAAAADYo0BiFAAAAAAAAECwogAAAAAgiFEAAAAAAAAAIFhRAAAAABDEKAAAAAAAAAAQrCgAAAAACGIUAAAAAAAAAAhWFAAAAAAEMQoAAAAAAAAABCsKAAAAAIIYBQAAAAAAAACCFQUAAAAAQYwCAAAAAAAAAMGKAgAAAIAgRgEAAAAAAACAYEUBAAAAQBCjAAAAAAAAAECwogAAAAAgiFEAAAAAAAAAIFhRAAAAABDEKAAAAAAAAAAQrCgAAAAACGIUAAAAAAAAQLCiAAAAAACj4GAXAAAAAAAAAAhWFAAwUUQEOwEMgJmxEwBBjAIAAAAAAAAAwYoCQDCbAAcVwasCghgFAAAAAAAAAIIVBYBgPwEY3+EKZwoIYhQAAAAAAAAACFYUAIIGBXv6sQ1VCghiFAAAAAAAAECwogAQhBEAe+6RD0kKCGIUAAAAAAAAQLCiABBMKAB79EkBTwo
