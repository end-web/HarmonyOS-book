name: Publish JianTing app information

on:
  push:
    branches: [main]
    paths:
      - docs/app-gallery/**
      - .github/workflows/app-gallery-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: app-gallery-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/app-gallery
      - name: Deploy app information
        id: deployment
        uses: actions/deploy-pages@v4
