name: jianhu-source

services:
  reader:
    image: ${READER_IMAGE:-changshengyu/reader:openj9-latest@sha256:bb9a4833e95a7121e4e3ab17cccf7ca0584ba6cc70054b4e77c9b0efc7f29e53}
    container_name: jianhu-reader
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      READER_APP_SECURE: "false"
      READER_APP_CACHECHAPTERCONTENT: "true"
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx384m
    volumes:
      - ./data/reader/logs:/logs
      - ./data/reader/storage:/storage
    expose:
      - "8080"
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/reader3/getSystemInfo >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 4
    networks: [backend]

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: jianhu/source-api:1.0.0
    container_name: jianhu-api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DB_PATH: /app/data/jianhu.db
      READER_BASE_URL: http://reader:8080
    volumes:
      - ./data/api:/app/data
    expose:
      - "3000"
    mem_limit: 224m
    cpus: 0.75
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    depends_on:
      reader:
        condition: service_healthy
    networks: [backend]

  caddy:
    image: ${CADDY_IMAGE:-caddy:2.10-alpine}
    container_name: jianhu-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    mem_limit: 96m
    cpus: 0.25
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
    networks: [backend]

networks:
  backend:
    name: jianhu-source-backend
    driver: bridge
